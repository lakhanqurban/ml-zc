# Render blueprint.
#
# Render reads this file from the repository root and provisions the service
# from the UI (or with the Render API). The free plan is enough for this
# model.
#
#   1. push the repository to GitHub
#   2. open https://render.com/ -> "New" -> "Blueprint"
#   3. select the repository; Render detects render.yaml automatically
#   4. deploy
#
# Render injects $PORT, which the Dockerfile honours.

services:
  - type: web
    name: hotel-cancellation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "9696"
