services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-cancellation:midterm
    container_name: hotel-cancellation
    ports:
      - "9696:9696"
    environment:
      PORT: "9696"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
